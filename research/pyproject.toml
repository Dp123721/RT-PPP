[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtppp-analysis"
version = "0.1.0"
description = "Standalone scientific analysis tools for RT-PPP products and telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RT-PPP Research" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4"
]

[project.optional-dependencies]
full = [
  "pandas>=2.1,<3",
  "pyarrow>=14,<22"
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rtppp-analysis = "rtppp_analysis.cli:main"
rtppp-analysis-gui = "rtppp_analysis.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rtppp_analysis.schemas" = ["*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
